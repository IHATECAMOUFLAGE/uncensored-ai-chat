<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmilyAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c14b8f'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia' font-weight='700' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#14102b;--bg2:#2a1240;--b1:#e0489b;--b2:#3f8cff;--b3:#2ed3b7;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.16);--tx:#f4f1ff;--mut:#b6aed4;--acc:#e0489b;--acc2:#8b5cf6;--user:rgba(224,72,155,.22);--code:rgba(8,6,22,.55);--err:#ff8a9b;color-scheme:dark}
:root[data-theme=light]{--bg1:#f7eefb;--bg2:#e6efff;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--edge:rgba(255,255,255,.9);--tx:#241a3a;--mut:#6c6286;--user:rgba(224,72,155,.15);--code:rgba(36,26,58,.08);--err:#c0314f;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden}.blobs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.blobs i:nth-child(1){width:42vw;height:42vw;background:var(--b1);top:-12vw;left:-8vw}.blobs i:nth-child(2){width:38vw;height:38vw;background:var(--b2);bottom:-14vw;right:-6vw}.blobs i:nth-child(3){width:26vw;height:26vw;background:var(--b3);top:40%;left:45%;opacity:.3}
:root[data-theme=light] .blobs i{opacity:.35}
.app{position:relative;z-index:1;display:flex;gap:14px;height:100%;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.side{width:272px;flex:none;display:flex;flex-direction:column;padding:16px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 22px Fraunces,Georgia,serif;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font:600 19px Fraunces,serif;color:#fff;box-shadow:0 4px 18px rgba(224,72,155,.5)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--edge);background:var(--glass2);border-radius:12px;padding:9px 14px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:rgba(255,255,255,.2)}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
:focus-visible{outline:2px solid var(--b3);outline-offset:2px}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:12px;cursor:pointer;color:var(--mut);border:1px solid transparent}
.item:hover{background:var(--glass)}.item.on{background:var(--glass2);color:var(--tx);border-color:var(--edge)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{opacity:0;background:none;border:0;cursor:pointer;color:var(--mut);padding:2px 6px;border-radius:8px}
.item:hover button,.item.on button{opacity:1}.item button:hover{color:var(--err)}
.empty-l{color:var(--mut);padding:8px 10px;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.top .grow{flex:1}
.sel{background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:8px 12px;min-width:0;max-width:100%}
.sel option,.sel optgroup{background:#241a3a;color:#f4f1ff}
#model{width:min(260px,44vw)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(46,211,183,.18);color:var(--b3);border:1px solid rgba(46,211,183,.35)}
:root[data-theme=light] .tag{color:#0f8f7b}
.menu{display:none}
.msgs{flex:1;overflow:auto;padding:22px 16px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;align-items:flex-start}.msg.user{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;font:600 16px Fraunces,serif;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.msg.user .av{background:var(--glass2);color:var(--tx);font:600 13px Manrope}
.bub{padding:11px 15px;border-radius:18px;max-width:calc(100% - 46px);min-width:0;overflow-wrap:anywhere}
.msg.user .bub{background:var(--user);border:1px solid var(--edge);white-space:pre-wrap}
.msg.bot .bub{background:var(--glass);border:1px solid var(--edge)}
.bub.err{color:var(--err);border-color:var(--err)!important}
.acts{display:flex;gap:6px;margin-top:6px}.acts button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:8px}.acts button:hover{color:var(--tx);background:var(--glass)}
.bub p{margin:0 0 .7em}.bub p:last-child,.bub ul:last-child{margin-bottom:0}.bub ul,.bub ol{margin:0 0 .7em;padding-left:1.3em}
.bub h1,.bub h2,.bub h3{font:600 1.1em Fraunces,serif;margin:.8em 0 .4em}
.bub a{color:var(--b3)}.bub code{background:var(--code);padding:1px 6px;border-radius:6px;font:13px ui-monospace,Menlo,Consolas,monospace}
.pre{position:relative;margin:.5em 0 .8em;background:var(--code);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.pre .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:6px 12px;border-bottom:1px solid var(--edge)}
.pre .hd button{background:none;border:0;color:var(--mut);cursor:pointer}.pre .hd button:hover{color:var(--tx)}
.pre pre{margin:0;padding:12px;overflow:auto}.pre code{background:none;padding:0;white-space:pre}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-4px)}}
.hero{text-align:center;margin:8vh auto 0;max-width:560px}
.hero h1{font:600 clamp(30px,5vw,44px)/1.15 Fraunces,Georgia,serif;margin:0 0 10px}.hero p{color:var(--mut);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chips .btn{font-size:13px}
.comp{padding:0 16px 16px}.box{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 8px 8px 16px;background:var(--glass2)}
.box textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:200px;padding:8px 0;line-height:1.5}
.box textarea::placeholder{color:var(--mut)}.box .btn{border-radius:14px;height:40px}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
.modal{position:fixed;inset:0;z-index:5;background:rgba(5,3,15,.5);display:none;place-items:center;padding:16px}.modal.on{display:grid}
.card{width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;background:var(--glass2)}
.card h2{margin:0 0 4px;font:600 22px Fraunces,serif}.card .sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.f label{font-size:13px;color:var(--mut)}
.f input,.f textarea{background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;width:100%}
.keys{border:1px solid var(--edge);border-radius:14px;padding:12px 12px 0;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:9;background:var(--glass2);border:1px solid var(--edge);backdrop-filter:blur(20px);padding:9px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--edge);border-radius:8px}
@media(max-width:820px){.side{position:fixed;z-index:4;left:14px;top:14px;bottom:14px;transform:translateX(-120%);transition:transform .25s;background:var(--bg1)}.side.on{transform:none}.menu{display:inline-block}.app{padding:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side glass" id="side">
    <div class="brand"><div class="logo">E</div>EmilyAI</div>
    <button class="btn pri" id="newChat">New chat</button>
    <div class="list" id="list"></div>
    <button class="btn" id="openSet">Settings &amp; API keys</button>
  </aside>
  <main class="main glass">
    <div class="top">
      <button class="btn menu" id="menu" aria-label="Open chats">Chats</button>
      <select class="sel" id="prov" aria-label="Provider"></select>
      <input class="sel" id="model" list="models" placeholder="Model" aria-label="Model" autocomplete="off">
      <datalist id="models"></datalist>
      <span class="tag" id="tag" hidden>Free · no key</span>
      <span class="grow"></span>
      <button class="btn" id="exp" title="Export chat as Markdown">Export</button>
    </div>
    <div class="msgs" id="msgs"><div class="wrap" id="wrap"></div></div>
    <div class="comp">
      <div class="box glass">
        <textarea id="inp" rows="1" placeholder="Message EmilyAI…" aria-label="Message"></textarea>
        <button class="btn pri" id="send">Send</button>
      </div>
      <div class="foot">Enter to send · Shift+Enter for a new line · Keys stay in this browser</div>
    </div>
  </main>
</div>

<div class="modal" id="modal"><div class="card glass" role="dialog" aria-modal="true" aria-labelledby="st">
  <h2 id="st">Settings</h2><p class="sub">API keys are stored only in this browser and sent only to the provider you pick.</p>
  <div class="keys" id="keys"></div>
  <div class="f"><label for="sys">System prompt</label><textarea id="sys" rows="3"></textarea></div>
  <div class="f"><label for="temp">Temperature: <b id="tv"></b></label><input type="range" id="temp" min="0" max="2" step=".1"></div>
  <div class="row"><button class="btn" id="theme">Toggle light / dark</button><button class="btn" id="wipe">Delete all chats</button><button class="btn pri" id="close">Done</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

// ---------- Providers (all speak the OpenAI chat-completions format) ----------
const P={
 free:{name:'EmilyAI Free (no key)',url:'https://text.pollinations.ai/openai',key:false,models:['openai','openai-fast','mistral','llama','deepseek','qwen-coder','gemini','claude-hybridspace']},
 openrouter:{name:'OpenRouter',base:'https://openrouter.ai/api/v1',key:true,models:['openrouter/auto','meta-llama/llama-3.3-70b-instruct:free','deepseek/deepseek-chat-v3-0324:free','google/gemma-3-27b-it:free']},
 google:{name:'Google Gemini',base:'https://generativelanguage.googleapis.com/v1beta/openai',key:true,models:['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash']},
 openai:{name:'OpenAI',base:'https://api.openai.com/v1',key:true,models:['gpt-4o','gpt-4o-mini','gpt-4.1','gpt-4.1-mini','o4-mini']},
 nvidia:{name:'NVIDIA NIM',base:'https://integrate.api.nvidia.com/v1',key:true,models:['meta/llama-3.3-70b-instruct','nvidia/llama-3.1-nemotron-70b-instruct','deepseek-ai/deepseek-r1']},
 groq:{name:'Groq',base:'https://api.groq.com/openai/v1',key:true,models:['llama-3.3-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768']},
 mistral:{name:'Mistral',base:'https://api.mistral.ai/v1',key:true,models:['mistral-large-latest','mistral-small-latest','codestral-latest']},
 deepseek:{name:'DeepSeek',base:'https://api.deepseek.com/v1',key:true,models:['deepseek-chat','deepseek-reasoner']},
 custom:{name:'Custom (OpenAI-compatible)',base:'http://localhost:11434/v1',key:true,models:[]}
};
let S=Object.assign({provider:'free',models:{},keys:{},bases:{},system:'You are EmilyAI, a warm, clear and concise assistant.',temp:.7,theme:'dark'},store.get('emilyai.settings',{}));
let chats=store.get('emilyai.chats',[]),cur=store.get('emilyai.cur',null),busy=null;
const save=()=>{store.set('emilyai.settings',S);store.set('emilyai.chats',chats);store.set('emilyai.cur',cur)};
const chat=()=>chats.find(c=>c.id===cur);
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
const base=k=>(S.bases[k]||P[k].base||'').replace(/\/+$/,'');
const endpoint=k=>k==='free'?P.free.url:base(k)+'/chat/completions';

// ---------- Safe markdown ----------
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){
 s=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
 return s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function block(t){
 const out=[];let list=null;
 const end=()=>{if(list){out.push(`<${list.t}>${list.i.join('')}</${list.t}>`);list=null}};
 for(const l of t.split('\n')){
  let m;
  if(m=l.match(/^\s*[-*]\s+(.*)/)){if(!list||list.t!=='ul'){end();list={t:'ul',i:[]}}list.i.push(`<li>${inline(m[1])}</li>`)}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(!list||list.t!=='ol'){end();list={t:'ol',i:[]}}list.i.push(`<li>${inline(m[1])}</li>`)}
  else if(m=l.match(/^(#{1,3})\s+(.*)/)){end();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`)}
  else if(!l.trim())end();
  else{end();out.push(`<p>${inline(l)}</p>`)}
 }
 end();return out.join('');
}
function md(t){
 const parts=t.split(/```/);
 return parts.map((p,i)=>{
  if(i%2===0)return block(p);
  const nl=p.indexOf('\n'),lang=nl>-1?p.slice(0,nl).trim():'',code=nl>-1?p.slice(nl+1):p;
  return `<div class="pre"><div class="hd"><span>${esc(lang||'code')}</span><button data-copy>Copy</button></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`;
 }).join('');
}

// ---------- UI ----------
function renderList(){
 const l=$('#list');l.innerHTML='';
 if(!chats.length){l.innerHTML='<div class="empty-l">No chats yet.</div>';return}
 for(const c of chats){
  const d=document.createElement('div');d.className='item'+(c.id===cur?' on':'');d.tabIndex=0;
  d.innerHTML=`<span>${esc(c.title)}</span><button aria-label="Delete chat">✕</button>`;
  d.onclick=e=>{if(e.target.tagName==='BUTTON'){chats=chats.filter(x=>x.id!==c.id);if(cur===c.id)cur=chats[0]?.id||null;save();renderAll()}else{if(busy)return toast('Stop the reply first');cur=c.id;save();renderAll();$('#side').classList.remove('on')}};
  d.onkeydown=e=>{if(e.key==='Enter')d.click()};
  l.appendChild(d);
 }
}
function renderMsgs(){
 const w=$('#wrap'),c=chat();w.innerHTML='';
 if(!c||!c.msgs.length){
  w.innerHTML=`<div class="hero"><h1>Hi, I’m EmilyAI.</h1><p>Pick a provider above, or start right now with a free model. No key needed.</p><div class="chips"></div></div>`;
  for(const q of ['Explain quantum computing simply','Write a haiku about rain','Plan a 3-day trip to Lisbon','Review my code for bugs'])
   {const b=document.createElement('button');b.className='btn';b.textContent=q;b.onclick=()=>send(q);w.querySelector('.chips').appendChild(b)}
  return;
 }
 c.msgs.forEach((m,i)=>{
  const e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');
  const last=i===c.msgs.length-1;
  e.innerHTML=`<div class="av">${m.role==='user'?'You':'E'}</div><div><div class="bub${m.err?' err':''}"></div></div>`;
  const b=e.querySelector('.bub');
  if(m.role==='user')b.textContent=m.content;
  else if(!m.content&&busy&&last)b.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  else b.innerHTML=md(m.content);
  if(m.role!=='user'&&m.content&&!(busy&&last)){
   const a=document.createElement('div');a.className='acts';
   a.innerHTML='<button data-cp>Copy</button>'+(last?'<button data-re>Regenerate</button>':'');
   a.querySelector('[data-cp]').onclick=()=>navigator.clipboard.writeText(m.content).then(()=>toast('Copied'));
   const r=a.querySelector('[data-re]');if(r)r.onclick=regen;
   b.parentNode.appendChild(a);
  }
  w.appendChild(e);
 });
 const s=$('#msgs');s.scrollTop=s.scrollHeight;
}
function renderTop(){
 const sel=$('#prov');if(!sel.options.length)for(const k in P)sel.add(new Option(P[k].name,k));
 sel.value=S.provider;
 const p=P[S.provider];$('#model').value=S.models[S.provider]||p.models[0]||'';
 $('#models').innerHTML=(modelCache[S.provider]||p.models).map(m=>`<option value="${esc(m)}">`).join('');
 $('#tag').hidden=S.provider!=='free';
 loadModels(S.provider);
}
function renderAll(){renderList();renderMsgs();renderTop();$('#send').textContent=busy?'Stop':'Send'}
const modelCache={};
async function loadModels(k){
 try{
  if(modelCache[k]||!(k==='free'||k==='openrouter'))return;
  if(k==='free'){
   const r=await fetch('https://text.pollinations.ai/models');const j=await r.json();
   const ids=j.map(m=>typeof m==='string'?m:m.name).filter(Boolean);if(ids.length)modelCache[k]=ids;
  }else{
   const r=await fetch('https://openrouter.ai/api/v1/models');const j=await r.json();
   const ids=j.data.map(m=>m.id);modelCache[k]=[...ids.filter(i=>i.endsWith(':free')),...ids.filter(i=>!i.endsWith(':free'))];
  }
  if(S.provider===k)$('#models').innerHTML=modelCache[k].map(m=>`<option value="${esc(m)}">`).join('');
 }catch{}
}

// ---------- Chat ----------
function newChat(){const c={id:uid(),title:'New chat',msgs:[]};chats.unshift(c);cur=c.id;save();renderAll();$('#inp').focus();return c}
async function send(text){
 if(busy)return;
 text=(text??$('#inp').value).trim();if(!text)return;
 const k=S.provider,p=P[k];
 if(p.key&&!S.keys[k]){toast(`Add your ${p.name} API key first`);openSettings();return}
 const model=($('#model').value||'').trim();if(!model)return toast('Choose a model');
 S.models[k]=model;
 const c=chat()||newChat();
 if(!c.msgs.length)c.title=text.slice(0,44);
 c.msgs.push({role:'user',content:text},{role:'assistant',content:''});
 $('#inp').value='';autosize();save();
 await run(c,k,model);
}
function regen(){const c=chat();if(!c||busy)return;c.msgs.pop();c.msgs.push({role:'assistant',content:''});run(c,S.provider,S.models[S.provider]||$('#model').value)}
async function run(c,k,model){
 const ctrl=new AbortController();busy=ctrl;renderAll();
 const a=c.msgs[c.msgs.length-1];
 const history=c.msgs.slice(0,-1).filter(m=>!m.err).map(({role,content})=>({role,content}));
 const msgs=(S.system?[{role:'system',content:S.system}]:[]).concat(history);
 const headers={'Content-Type':'application/json'};
 if(P[k].key)headers.Authorization='Bearer '+S.keys[k];
 if(k==='openrouter'){headers['HTTP-Referer']=location.origin||'https://emilyai.app';headers['X-Title']='EmilyAI'}
 try{
  const r=await fetch(endpoint(k),{method:'POST',headers,signal:ctrl.signal,body:JSON.stringify({model,messages:msgs,temperature:S.temp,stream:true})});
  if(!r.ok){let t='';try{const j=await r.json();t=j.error?.message||j.message||JSON.stringify(j)}catch{}
   throw new Error(`${r.status} ${r.statusText}${t?': '+t:''}`)}
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('event-stream')){const j=await r.json();a.content=j.choices?.[0]?.message?.content||'(empty reply)'}
  else{
   const rd=r.body.getReader(),dec=new TextDecoder();let buf='',last=0;
   for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines){
     const s=ln.trim();if(!s.startsWith('data:'))continue;const d=s.slice(5).trim();if(d==='[DONE]')continue;
     try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t)a.content+=t}catch{}
    }
    if(Date.now()-last>60){last=Date.now();renderMsgs()}
   }
   if(!a.content)a.content='(empty reply)';
  }
 }catch(e){
  if(e.name==='AbortError'){if(!a.content)c.msgs.pop()}
  else{a.err=true;a.content=(a.content?a.content+'\n\n':'')+'Request failed — '+e.message+(/Failed to fetch|NetworkError/i.test(e.message)?'. The provider may block browser requests (CORS) or you may be offline. Try another provider, or set a proxy URL in Settings.':'')}
 }
 busy=null;save();renderAll();
}

// ---------- Settings ----------
function openSettings(){
 const k=$('#keys');k.innerHTML='';
 for(const id in P){
  if(!P[id].key)continue;
  const f=document.createElement('div');f.className='f';
  f.innerHTML=`<label for="k_${id}">${esc(P[id].name)} API key</label><input id="k_${id}" type="password" autocomplete="off" spellcheck="false" placeholder="Paste key"><input id="b_${id}" type="url" placeholder="Base URL: ${esc(P[id].base)}" aria-label="${esc(P[id].name)} base URL" style="font-size:12px">`;
  f.querySelector(`#k_${id}`).value=S.keys[id]||'';f.querySelector(`#b_${id}`).value=S.bases[id]||'';
  f.querySelector(`#k_${id}`).oninput=e=>{S.keys[id]=e.target.value.trim();save()};
  f.querySelector(`#b_${id}`).oninput=e=>{S.bases[id]=e.target.value.trim();save()};
  k.appendChild(f);
 }
 $('#sys').value=S.system;$('#temp').value=S.temp;$('#tv').textContent=S.temp;
 $('#modal').classList.add('on');
}
const closeSet=()=>{$('#modal').classList.remove('on');save()};
function applyTheme(){document.documentElement.dataset.theme=S.theme}
function autosize(){const t=$('#inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px'}

$('#prov').onchange=e=>{S.provider=e.target.value;save();renderTop()};
$('#model').onchange=e=>{S.models[S.provider]=e.target.value.trim();save()};
$('#send').onclick=()=>busy?busy.abort():send();
$('#inp').oninput=autosize;
$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();busy?0:send()}};
$('#newChat').onclick=()=>{if(busy)return;newChat();$('#side').classList.remove('on')};
$('#openSet').onclick=openSettings;$('#close').onclick=closeSet;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeSet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSet()});
$('#sys').oninput=e=>{S.system=e.target.value;save()};
$('#temp').oninput=e=>{S.temp=+e.target.value;$('#tv').textContent=S.temp;save()};
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applyTheme();save()};
$('#wipe').onclick=()=>{if(confirm('Delete all chats? This cannot be undone.')){chats=[];cur=null;save();renderAll();closeSet()}};
$('#menu').onclick=()=>$('#side').classList.toggle('on');
$('#wrap').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){navigator.clipboard.writeText(b.closest('.pre').querySelector('code').textContent).then(()=>toast('Code copied'))}});
$('#exp').onclick=()=>{
 const c=chat();if(!c||!c.msgs.length)return toast('Nothing to export yet');
 const t=`# ${c.title}\n\n`+c.msgs.map(m=>`**${m.role==='user'?'You':'EmilyAI'}:**\n\n${m.content}`).join('\n\n---\n\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download=(c.title.replace(/[^\w-]+/g,'_')||'chat')+'.md';a.click();URL.revokeObjectURL(a.href);
};
if(!P[S.provider])S.provider='free';
if(cur&&!chat())cur=chats[0]?.id||null;
applyTheme();renderAll();
})();
</script>
